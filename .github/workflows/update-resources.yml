name: Mettre à jour les scrapers vStream

on:
  schedule:
    - cron: '0 0 * * 0'   # chaque dimanche
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger et réorganiser les scrapers
        run: |
          # Télécharger la dernière version de vStream
          wget -q -O vstream.zip https://github.com/Kodi-vStream/venom-xbmc-addons/archive/refs/heads/master.zip
          unzip -q vstream.zip
          
          # Supprimer l'ancien dossier resources s'il existe
          rm -rf resources
          
          # Déplacer le dossier resources à la racine
          mv venom-xbmc-addons-master/plugin.video.vstream/resources ./resources
          
          # Nettoyer
          rm -rf venom-xbmc-addons-master vstream.zip
          
          # Vérifier que les fichiers sont bien là
          ls -la resources/sites/ | head -20

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources
          git diff --quiet && git diff --staged --quiet || git commit -m "Mise à jour automatique des scrapers vStream"
          git push
